default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run through the project environment rather than an isolated one, so
      # mypy sees the same dependencies as `uv run mypy` and CI do. Mirroring
      # the dependency list into additional_dependencies drifts silently.
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

  # Belt and braces: this repo goes public, so block accidental data commits.
  - repo: local
    hooks:
      - id: no-real-data
        name: block committing databases, .env files and exports
        entry: >-
          Refusing to commit a data/secret file. Real athlete data and
          credentials must never enter git history.
        language: fail
        files: '(^|/)(\.env$|data/|.*\.(db|sqlite3?)$)'
        exclude: '^\.env\.example$'

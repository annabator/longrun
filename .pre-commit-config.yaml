default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - pandas-stubs
          - types-requests
          - typer
        args: [--strict]

  # Belt and braces: this repo goes public, so block accidental data commits.
  - repo: local
    hooks:
      - id: no-real-data
        name: block committing databases, .env files and exports
        entry: >-
          Refusing to commit a data/secret file. Real athlete data and
          credentials must never enter git history.
        language: fail
        files: '(^|/)(\.env$|data/|.*\.(db|sqlite3?)$)'
        exclude: '^\.env\.example$'
